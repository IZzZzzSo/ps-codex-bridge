<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">↔</span><h1>图像桥</h1><span class="version">PS × Codex</span></div>
    <div class="connection-row"><span id="connectionState">未连接</span><button id="toggleConnection" class="text-button">连接设置</button></div>
  </header>
  <main>
    <section id="connection" class="settings">
      <label for="pairToken">本机配对码</label>
      <input id="pairToken" type="password" placeholder="粘贴桥接程序中的配对码" aria-label="配对码">
      <button id="connect" class="wide">保存并连接</button>
      <p class="hint">使用期间保持本地图像桥运行。</p>
    </section>
    <section class="card">
      <div class="section-title"><span class="step">1</span>截取画面</div>
      <div class="row"><button id="captureSelection" class="grow capture-button">局部选区</button><button id="captureCanvas" class="grow capture-button">整个画布</button></div>
      <div id="captureInfo" class="info">在 PS 中选好区域，或截取整个画布。</div>
    </section>
    <section class="card compose">
      <div class="section-title"><span class="step">2</span>描述修改</div>
      <textarea id="prompt" placeholder="想怎么改？例如：保留主体，把背景改成清晨的森林。" aria-label="修改需求"></textarea>
      <div class="destination-bar"><div class="target-label">发送至 <span id="destinationSummary">新对话</span></div><button id="toggleDestination" class="text-button">更改</button></div>
      <div id="destinationSettings" class="settings" style="display:none">
        <input id="destinationMode" type="text" value="new" style="display:none">
        <div class="row segmented"><button id="targetNew" class="grow">新对话</button><button id="targetExisting" class="grow">已有对话</button></div>
        <input id="projectPath" placeholder="项目工作目录（可留空）" aria-label="项目工作目录">
        <input id="threadLink" placeholder="粘贴完整的 codex://threads/ 链接" aria-label="已有对话链接" style="display:none">
        <p id="destinationHint" class="hint"></p>
        <button id="doneDestination" class="wide">完成设置</button>
      </div>
    </section>
    <section class="card">
      <div class="section-title"><span class="step">3</span>回传原位 <span id="jobCount" class="count">0</span><button id="refresh" class="text-button">刷新</button></div>
      <div id="jobs"><p class="empty">完成修改后，结果会显示在这里。</p></div>
    </section>
    <footer>以新图层回传到截图位置 · 保留原图</footer>
  </main>
  <div class="actionbar"><button id="send" class="primary" disabled>传给 Codex ↗</button><p id="sendHint" class="hint send-hint">打开后确认需求并发送</p></div>
  <div id="status" role="status">请先启动本地图像桥并配对。</div>
  <script src="panel.js"></script>
</body>
</html>
